dependencies {
    implementation project(':api')

    implementation 'io.github.lsd-consulting:lsd-logging-library:1.0.18'

    // Boot 4 modular web + jackson2 bridge for Feign converters still on jackson2 ObjectMapper
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-jackson2'
    implementation 'org.springframework.boot:spring-boot-http-converter'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}
